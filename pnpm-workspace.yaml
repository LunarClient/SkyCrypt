allowBuilds:
  "@prisma/client": false
  "@tailwindcss/oxide": true
  better-sqlite3: true
  esbuild: true
  protobufjs: false
  sharp: true
  simple-git-hooks: true
  svelte-preprocess: true
  workerd: true

updateConfig:
  ignoreDependencies:
    - typescript

publicHoistPattern:
  - "@takumi-rs/core-*"

permissions:
  "@tanstack/svelte-table":
    skills: true

skills:
  dirs:
    - .github/skills
